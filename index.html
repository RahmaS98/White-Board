<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard</title>
<meta name="theme-color" content="#b8bec6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#d9dde2;--frame:#b8bec6;--frame2:#8e959e;--board:#fbfcfc;--ink:#1f3a8a;--red:#c0392b;--grid:#e3e8ec;--text:#2b3138;--muted:#6b747e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e22;--frame:#555c65;--frame2:#3a4046;--text:#e6e9ec;--muted:#9aa3ad}}
:root[data-theme="dark"]{--bg:#1b1e22;--frame:#555c65;--frame2:#3a4046;--text:#e6e9ec;--muted:#9aa3ad}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font:800 15px Nunito,system-ui,sans-serif;padding:10px;border:0;border-radius:10px;background:var(--frame);color:var(--text);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.frame{background:linear-gradient(145deg,var(--frame),var(--frame2));padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.board{background:var(--board);border-radius:6px;padding:14px 16px 18px;color:#222;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 32px;box-shadow:inset 0 1px 4px rgba(0,0,0,.18)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.title{font:700 28px Caveat,cursive;color:var(--red);text-align:center;flex:1;line-height:1.1}
.nav{width:40px;height:40px;border:0;border-radius:50%;background:#eef1f3;font-size:20px;color:#333;cursor:pointer}
h2{font:700 22px Caveat,cursive;color:var(--ink);margin:10px 0 2px}
textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;font:500 22px/32px Caveat,cursive;color:var(--ink);padding:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;min-height:32px}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
li span{flex:1;font:500 22px/32px Caveat,cursive;color:var(--ink)}
li.done span{text-decoration:line-through;color:#8a94a6}
li .x{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px 8px}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;border:0;border-bottom:2px dashed var(--ink);background:transparent;font:500 22px Caveat,cursive;color:var(--ink);padding:2px 0}
.add button{border:0;border-radius:8px;background:var(--ink);color:#fff;font:800 14px Nunito,sans-serif;padding:0 14px;cursor:pointer}
.tray{height:10px;margin:0 20%;background:var(--frame2);border-radius:0 0 8px 8px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}

.auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.auth.show{display:flex}
.card{width:100%;max-width:360px;background:var(--board);color:#222;border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card h1{font:700 32px Caveat,cursive;color:var(--red);margin:0 0 6px}
.card p{margin:0 0 12px;font-size:14px;color:#555}
.card input{width:100%;padding:10px;margin-bottom:8px;border:1px solid #c5ccd3;border-radius:8px;font:600 16px Nunito,sans-serif}
.card .row{display:flex;gap:8px}
.card button{flex:1;padding:10px;border:0;border-radius:8px;font:800 15px Nunito,sans-serif;cursor:pointer;background:var(--ink);color:#fff}
.card button.alt{background:#e3e8ec;color:#222}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.out{background:none;border:0;color:var(--muted);text-decoration:underline;font:600 13px Nunito,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="auth" id="auth"><div class="card">
  <h1>Whiteboard</h1>
  <p>Sign in once on each device. Your notes then sync between your phone and tablet.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
  <div class="row"><button id="in">Sign in</button><button class="alt" id="up">Create account</button></div>
  <div class="err" id="err" role="alert"></div>
</div></div>
<div class="wrap">
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-p="d" aria-selected="true">Day</button>
    <button role="tab" data-p="w" aria-selected="false">Week</button>
    <button role="tab" data-p="m" aria-selected="false">Month</button>
  </div>
  <div class="frame"><div class="board">
    <div class="head">
      <button class="nav" id="prev" aria-label="Previous">‹</button>
      <div class="title" id="title"></div>
      <button class="nav" id="next" aria-label="Next">›</button>
    </div>
    <h2>Notes</h2>
    <textarea id="note" placeholder="Write here…" aria-label="Notes"></textarea>
    <h2>List</h2>
    <ul id="list"></ul>
    <div class="add"><input id="new" placeholder="Add an item" aria-label="New list item"><button id="addBtn">Add</button></div>
  </div></div>
  <div class="tray"></div>
  <div class="hint"><span id="status" aria-live="polite"></span> <button class="out" id="out">Sign out</button></div>
</div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const SUPABASE_URL="https://sbhqvqdjhgxkkmvgqobr.supabase.co",SUPABASE_KEY="sb_publishable_2fQr_OIlHNTljIt0B8oebQ_JDXRHAn0";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let P='d',off=0,uid=null,chan=null,timer=null;const cache={};let dirty=[];
const pad=n=>n<10?'0'+n:''+n;
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
function base(){const d=new Date();d.setHours(12,0,0,0);
  if(P==='d')d.setDate(d.getDate()+off);
  if(P==='w'){const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k+off*7)}
  if(P==='m'){d.setDate(1);d.setMonth(d.getMonth()+off)}
  return d}
function key(){const d=base();return P+'-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+(P==='m'?'':'-'+pad(d.getDate()))}
function label(){const d=base();
  if(P==='d'){const o=d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});return off===0?'Today · '+o:o}
  if(P==='w'){const e=new Date(d);e.setDate(e.getDate()+6);const f={month:'short',day:'numeric'};return 'Week of '+d.toLocaleDateString(undefined,f)+' – '+e.toLocaleDateString(undefined,f)}
  return d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}
const cur=()=>cache[key()]||(cache[key()]=(uid&&ls('wb-'+uid+'-'+key()))||{n:'',i:[]});
const say=t=>$('status').textContent=t;
async function push(k){
  const {error}=await sb.from('boards').upsert({user_id:uid,key:k,data:cache[k]},{onConflict:'user_id,key'});
  if(error){if(!dirty.includes(k))dirty.push(k);ls('wb-dirty-'+uid,dirty);say('Offline. Will sync when connected.')}
  else{dirty=dirty.filter(x=>x!==k);ls('wb-dirty-'+uid,dirty);say('Synced across your devices')}
}
function persist(){if(!uid)return;const k=key();ls('wb-'+uid+'-'+k,cache[k]);push(k)}
async function flush(){for(const k of [...dirty])if(cache[k]||ls('wb-'+uid+'-'+k)){cache[k]=cache[k]||ls('wb-'+uid+'-'+k);await push(k)}}
function render(){
  const c=cur(),ul=$('list'),note=$('note');
  $('title').textContent=label();
  if(document.activeElement!==note&&note.value!==c.n)note.value=c.n;
  ul.innerHTML='';
  c.i.forEach((it,idx)=>{
    const li=document.createElement('li');if(it.d)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!it.d;cb.setAttribute('aria-label','Mark done');
    cb.onchange=()=>{it.d=cb.checked;persist();render()};
    const s=document.createElement('span');s.textContent=it.t;
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Delete item');
    x.onclick=()=>{c.i.splice(idx,1);persist();render()};
    li.append(cb,s,x);ul.appendChild(li)});
}
async function load(){
  const k=key();render();if(!uid)return;
  const {data,error}=await sb.from('boards').select('data').eq('key',k).maybeSingle();
  if(error){say('Offline. Showing saved copy');return}
  if(data&&!dirty.includes(k)){const d=data.data||{};cache[k]={n:d.n||'',i:Array.isArray(d.i)?d.i:[]};ls('wb-'+uid+'-'+k,cache[k])}
  say('Synced across your devices');if(k===key())render();
}
function live(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('boards-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'boards',filter:'user_id=eq.'+uid},p=>{
    const r=p.new;if(!r||!r.key||dirty.includes(r.key))return;
    const d=r.data||{};cache[r.key]={n:d.n||'',i:Array.isArray(d.i)?d.i:[]};ls('wb-'+uid+'-'+r.key,cache[r.key]);
    if(r.key===key())render()}).subscribe();
}
const go=()=>load();
$('note').addEventListener('input',e=>{cur().n=e.target.value;clearTimeout(timer);timer=setTimeout(persist,600)});
function add(){const t=$('new').value.trim();if(!t)return;cur().i.push({t,d:false});$('new').value='';persist();render();$('new').focus()}
$('addBtn').onclick=add;
$('new').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('prev').onclick=()=>{off--;go()};$('next').onclick=()=>{off++;go()};$('title').onclick=()=>{off=0;go()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{P=b.dataset.p;off=0;document.querySelectorAll('#tabs button').forEach(o=>o.setAttribute('aria-selected',o===b));go()});
async function authGo(fn){$('err').textContent='';
  const {data,error}=await fn({email:$('em').value.trim(),password:$('pw').value});
  if(error){const m=error.message||'';$('err').textContent=/invalid login/i.test(m)?'Wrong email or password.':/already/i.test(m)?'That email already has an account. Tap Sign in.':/password/i.test(m)?'Use at least 6 characters.':/confirm/i.test(m)?'Check your email to confirm, or turn off Confirm email in Supabase.':'Could not sign in. Check your connection.'}
  else if(!data.session)$('err').textContent='Check your email to confirm, or turn off Confirm email in Supabase.'}
$('in').onclick=()=>authGo(sb.auth.signInWithPassword.bind(sb.auth));
$('up').onclick=()=>authGo(sb.auth.signUp.bind(sb.auth));
$('out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev,sess)=>{
  const u=sess&&sess.user;
  if(u){if(uid===u.id)return;uid=u.id;dirty=ls('wb-dirty-'+uid)||[];$('auth').classList.remove('show');live();flush().then(load)}
  else{uid=null;if(chan){sb.removeChannel(chan);chan=null}Object.keys(cache).forEach(k=>delete cache[k]);$('auth').classList.add('show');render()}
});
addEventListener('online',()=>{if(uid)flush().then(load)});
render();
</script>
</body>
</html>
