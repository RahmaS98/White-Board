<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard</title>
<meta name="theme-color" content="#b8bec6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#d9dde2;--frame:#b8bec6;--frame2:#8e959e;--board:#fbfcfc;--ink:#1f3a8a;--red:#c0392b;--grid:#e3e8ec;--text:#2b3138;--muted:#6b747e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e22;--frame:#555c65;--frame2:#3a4046;--text:#e6e9ec;--muted:#9aa3ad}}
:root[data-theme="dark"]{--bg:#1b1e22;--frame:#555c65;--frame2:#3a4046;--text:#e6e9ec;--muted:#9aa3ad}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font:800 15px Nunito,system-ui,sans-serif;padding:10px;border:0;border-radius:10px;background:var(--frame);color:var(--text);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.frame{background:linear-gradient(145deg,var(--frame),var(--frame2));padding:12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.board{background:var(--board);border-radius:6px;padding:14px 16px 18px;color:#222;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 32px;box-shadow:inset 0 1px 4px rgba(0,0,0,.18)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.title{font:700 28px Caveat,cursive;color:var(--red);text-align:center;flex:1;line-height:1.1}
.nav{width:40px;height:40px;border:0;border-radius:50%;background:#eef1f3;font-size:20px;color:#333;cursor:pointer}
h2{font:700 22px Caveat,cursive;color:var(--ink);margin:10px 0 2px}
textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;font:500 22px/32px Caveat,cursive;color:var(--ink);padding:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;min-height:32px}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
li span{flex:1;font:500 22px/32px Caveat,cursive;color:var(--ink)}
li.done span{text-decoration:line-through;color:#8a94a6}
li .x{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px 8px}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;border:0;border-bottom:2px dashed var(--ink);background:transparent;font:500 22px Caveat,cursive;color:var(--ink);padding:2px 0}
.add button{border:0;border-radius:8px;background:var(--ink);color:#fff;font:800 14px Nunito,sans-serif;padding:0 14px;cursor:pointer}
.tray{height:10px;margin:0 20%;background:var(--frame2);border-radius:0 0 8px 8px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}

.auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.auth.show{display:flex}
.card{width:100%;max-width:360px;background:var(--board);color:#222;border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card h1{font:700 32px Caveat,cursive;color:var(--red);margin:0 0 6px}
.card p{margin:0 0 12px;font-size:14px;color:#555}
.card input{width:100%;padding:10px;margin-bottom:8px;border:1px solid #c5ccd3;border-radius:8px;font:600 16px Nunito,sans-serif}
.card .row{display:flex;gap:8px}
.card button{flex:1;padding:10px;border:0;border-radius:8px;font:800 15px Nunito,sans-serif;cursor:pointer;background:var(--ink);color:#fff}
.card button.alt{background:#e3e8ec;color:#222}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.out{background:none;border:0;color:var(--muted);text-decoration:underline;font:600 13px Nunito,sans-serif;cursor:pointer}
.car{font-size:13px;color:var(--muted)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.s{background:#eef3f8;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:#445}.s b{display:block;font:700 30px Caveat,cursive;color:var(--ink)}
.bars{display:flex;gap:6px;align-items:flex-end;height:100px}.col{flex:1;text-align:center;font-size:11px;color:#445}.bar{background:#dfe5ec;border-radius:4px;display:flex;align-items:flex-end}.bar i{display:block;width:100%;background:var(--ink);border-radius:4px}
li{display:block}.row{display:flex;align-items:center;gap:6px;min-height:32px}
.sub{margin:0 0 4px 26px}.sub li span.tx{font-size:20px}
.prog{font:700 18px Caveat,cursive;color:var(--red);text-decoration:none!important}
.ib{border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer;padding:4px 6px;font-weight:800}
.pn{margin:2px 0 8px 26px;display:flex;gap:6px;flex-wrap:wrap}.pn select,.pn input{font:600 14px Nunito,sans-serif;padding:5px;border:1px solid #c5ccd3;border-radius:6px;background:#fff;color:#222;max-width:100%}.pn input{flex:1;min-width:110px}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:20;pointer-events:none;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font:700 24px Caveat,cursive;z-index:21;text-align:center;max-width:90vw}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.pn label{display:flex;align-items:center;gap:4px;font-size:13px;color:#445}.wrap.wide{max-width:980px}
.tf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tf input,.tf select{font:600 14px Nunito,sans-serif;padding:5px;border:1px solid #c5ccd3;border-radius:6px;background:#fff;color:#222}.tf input[type=time]{width:96px}.tf #tt{flex:1;min-width:100px}.tf button{border:0;border-radius:8px;background:var(--ink);color:#fff;font:800 14px Nunito,sans-serif;padding:8px 14px;cursor:pointer}
#tl{position:relative;margin-top:8px}.hl{position:absolute;left:0;right:0;border-top:1px solid var(--grid);font-size:11px;color:#667;padding-left:2px}
.tb{position:absolute;border-radius:6px;padding:3px 18px 3px 6px;font:700 13px Nunito,sans-serif;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.15)}.tb small{display:block;font-weight:600;font-size:11px}.tb.dn{opacity:.5;text-decoration:line-through}.tb button{position:absolute;right:2px;top:0;border:0;background:none;font-size:14px;color:inherit;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.pc{border:1.5px solid var(--frame2);border-radius:8px;padding:0 8px 8px;background:#fff}.pc.today{border-color:var(--red);border-width:2.5px}.ph{background:var(--frame);margin:0 -8px 4px;padding:3px 8px;font:800 14px Nunito,sans-serif;color:#333}.pc h3{font:700 16px Caveat,cursive;color:var(--ink);margin:4px 0 0}.pc .row{min-height:26px}.pc .tx{font:500 18px Caveat,cursive;flex:1;color:var(--ink)}.pc .done .tx{text-decoration:line-through;color:#8a94a6}.pc input.ai{width:100%;border:0;border-bottom:1px dashed var(--ink);background:transparent;font:500 17px Caveat,cursive;color:var(--ink);margin-bottom:2px}.pc textarea{min-height:70px;font:500 18px/24px Caveat,cursive}
.wd{display:flex;gap:2px;flex-wrap:wrap}.wd button{border:0;background:none;font-size:18px;padding:2px;cursor:pointer;opacity:.25}.wd button.on{opacity:1}
.tabs{gap:4px}.tabs button{font-size:13px;padding:9px 2px}
.tf label{display:flex;align-items:center;gap:3px;font-size:13px;color:#445}.tf label input{min-width:0;flex:none}
[hidden]{display:none!important}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto;padding:9px 12px}
.dp{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"u g" "u t" "a t" "n n";gap:10px;padding:4px 0}
.dp h1{grid-column:1/3;font:700 38px Caveat,cursive;text-align:center;margin:0;color:#222}.dp .dd{grid-column:1/3;text-align:center;font:600 14px Nunito,sans-serif;color:#445}
.pb{border-radius:14px;padding:6px 10px 10px;position:relative;min-height:70px}.pb h3{font:700 19px Caveat,cursive;text-align:center;margin:0 0 2px;color:#222}
.pb .row{min-height:26px}.pb .tx{font:500 18px Caveat,cursive;flex:1;color:#222}.pb .done .tx{text-decoration:line-through;opacity:.6}
.pb input.ai{width:100%;border:0;border-bottom:1px dashed #555;background:transparent;font:500 17px Caveat,cursive;color:#222}.pb textarea{min-height:70px;font:500 19px/26px Caveat,cursive;color:#222}
.dc{position:absolute;pointer-events:none}
.jc{border:1.5px solid var(--frame2);border-radius:10px;background:#fff;margin:8px 0;padding:8px 10px;color:#222}
.pbar{height:8px;background:#e3e8ec;border-radius:4px;flex:1;min-width:50px}.pbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.jd{font:600 13px Nunito,sans-serif;border:1px solid #c5ccd3;border-radius:6px;padding:3px;background:#fff;color:#222}
.jt{font:600 15px Nunito,sans-serif;border:0;border-bottom:1px solid #c5ccd3;background:transparent;color:#222;flex:1;min-width:0}
.jm{margin:8px 0 0 2px;padding-left:8px;border-left:3px solid var(--ink)}
</style>
</head>
<body>

    <div class="add"><input id="new" placeholder="Add an item" aria-label="New list item"><button id="addBtn">Add</button></div></div><div id="tv" hidden><details id="sdet" style="margin:6px 0"><summary style="font:700 15px Nunito,sans-serif;cursor:pointer">Weekly schedule (repeats every week)</summary><div id="sdd" class="tf"><label><input type="checkbox">Sun</label><label><input type="checkbox">Mon</label><label><input type="checkbox">Tue</label><label><input type="checkbox">Wed</label><label><input type="checkbox">Thu</label><label><input type="checkbox">Fri</label><label><input type="checkbox">Sat</label></div><div class="tf"><input type="time" id="ss" value="08:00" aria-label="Start"><input type="time" id="se" value="09:00" aria-label="End"><input id="st" placeholder="Session title" aria-label="Session title"><select id="sc2" aria-label="Color"><option value="0">Blue</option><option value="1">Green</option><option value="2">Amber</option><option value="3">Coral</option><option value="4">Purple</option><option value="5">Gray</option></select><input id="sn" placeholder="Note (optional)" aria-label="Note" style="flex:1;min-width:140px"><button id="sbtn">Add to weekly schedule</button></div><div id="serr" style="color:var(--red);font-size:13px"></div><div id="sl"></div><button id="seed" class="ib" hidden>Load my school schedule (example)</button></details><div class="tf"><input type="time" id="ts" value="08:00" aria-label="Start"><input type="time" id="te" value="09:00" aria-label="End"><input id="tt" placeholder="Block title" aria-label="Block title"><select id="tc" aria-label="Color"><option value="0">Blue</option><option value="1">Green</option><option value="2">Amber</option><option value="3">Coral</option><option value="4">Purple</option><option value="5">Gray</option></select><button id="tbtn">Add</button></div><div id="terr" style="color:var(--red);font-size:13px"></div><div id="tl"></div></div><div id="pv" hidden></div><div id="dv" hidden></div></div><div id="stats" hidden></div><div id="qv" hidden><h2>Quran heart</h2><select id="qs" aria-label="Surah" style="width:100%;font:600 15px Nunito,sans-serif;padding:6px;border:1px solid #c5ccd3;border-radius:8px;background:#fff;color:#222"></select><svg id="qsvg" viewBox="0 0 340 300" width="100%" role="img"><title>Heart made of 114 surahs</title><defs><clipPath id="qc"><path id="qh" d="M170 282 C45 195 12 120 45 68 C78 20 142 30 170 80 C198 30 262 20 295 68 C328 120 295 195 170 282 Z"/></clipPath></defs><g id="qcells" clip-path="url(#qc)"></g><path d="M170 282 C45 195 12 120 45 68 C78 20 142 30 170 80 C198 30 262 20 295 68 C328 120 295 195 170 282 Z" style="fill:none;stroke:#222;stroke-width:2"/></svg><div id="qp"><div style="display:flex;justify-content:space-between;align-items:baseline"><span id="qn" style="font:700 26px Caveat,cursive;color:var(--red)"></span><span id="qt" style="font-size:13px;color:#445"></span></div><input type="range" id="qr" min="0" step="1" style="width:100%" aria-label="Verses memorized"><div id="qv2" style="font-size:14px"></div><div id="qtot" style="font-size:13px;color:#445;margin-top:6px"></div></div></div><div id="jv" hidden><h2>Project plans</h2><div class="tf"><input id="jn" placeholder="New project name" aria-label="New project name" style="flex:1"><button id="jadd">Add project</button></div><div id="jl"></div></div><div id="cv" hidden><h2>Programming brain</h2><svg id="bsvg" viewBox="0 0 340 250" width="100%" role="img"><title>Brain divided into programming topics</title><defs><clipPath id="bc"><ellipse cx="170" cy="105" rx="132" ry="80"/></clipPath></defs><g id="lobes" clip-path="url(#bc)"></g><ellipse cx="170" cy="105" rx="132" ry="80" style="fill:none;stroke:#222;stroke-width:2"/><g id="extra"></g><g id="blab"></g></svg><div id="bp"></div></div>
  </div></div>
  <div class="tray"></div>
  <div class="hint"><span id="status" aria-live="polite"></span><span id="ws"></span> <button class="out" id="out">Sign out</button><br><label class="car"><input type="checkbox" id="carry"> Carry unchecked items to the next day, week or month</label></div>
</div>

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{P=b.dataset.p;off=0;document.querySelectorAll('#tabs button').forEach(o=>o.setAttribute('aria-selected',o===b));$('prev').style.visibility=$('next').style.visibility=P==='s'?'hidden':'visible';go()});
$('model').onchange=e=>{cur().m=e.target.value;persist();render()};
$('tbtn').onclick=()=>{const s=$('ts').value,e=$('te').value,t=$('tt').value.trim();if(!t||!s||!e||mins(e)<=mins(s)){$('terr').textContent=!t?'Enter a title':'End must be after start';return}$('terr').textContent='';const c=cur();c.tb=c.tb||[];c.tb.push({id:uid8(),s,e,t,c:+$('tc').value,d:false});$('tt').value='';persist();render()};
$('qsvg').addEventListener('click',e=>{const g=e.target.closest('g[data-i]');if(g){qi=+g.getAttribute('data-i');drawQ();infoQ()}});
$('qs').onchange=e=>{qi=+e.target.value;drawQ();infoQ()};
$('qr').oninput=e=>{qb.q[qi+1]=+e.target.value;readQ();drawQ();sv('quran')};
$('bsvg').addEventListener('click',e=>{const g=e.target.closest('[data-i]');if(g){ci=+g.getAttribute('data-i');drawC();infoC()}});
$('sbtn').onclick=async()=>{const days=[...document.querySelectorAll('#sdd input')].map((c,i)=>c.checked?i:-1).filter(i=>i>=0),s=$('ss').value,e=$('se').value,t=$('st').value.trim();
  if(!t||!days.length||!s||!e||mins(e)<=mins(s)){$('serr').textContent=!t?'Enter a title':!days.length?'Choose at least one day':'End must be after start';return}
  $('serr').textContent='';const sc=await getBoard('sched'),o={s,e,t,c:+$('sc2').value,n:$('sn').value.trim(),days};
  if(sed){Object.assign(sc.tb.find(x=>x.id===sed)||{},o)}else sc.tb.push({id:uid8(),...o});
  sed=null;$('sbtn').textContent='Add to weekly schedule';$('st').value='';$('sn').value='';savePush('sched');await genSched(key());render()};
$('seed').onclick=async()=>{const sc=await getBoard('sched');SEED().forEach(o=>sc.tb.push({id:uid8(),...o}));savePush('sched');await genSched(key());render()};
$('jadd').onclick=()=>{const t=$('jn').value.trim();if(!t||!jb)return;const p={id:uid8(),n:t,due:'',ms:[]};jb.pj.push(p);jo=p.id;$('jn').value='';savePush('projects');renderJ()};
$('jn').onkeydown=e=>{if(e.key==='Enter')$('jadd').onclick()};
$('carry').checked=carry;$('carry').onchange=e=>{carry=e.target.checked;ls('wb-carry',carry)};
async function authGo(fn){$('err').textContent='';
  const {data,error}=await fn({email:$('em').value.trim(),password:$('pw').value});
  if(error){const m=error.message||'';$('err').textContent=/invalid login/i.test(m)?'Wrong email or password.':/already/i.test(m)?'That email already has an account. Tap Sign in.':/password/i.test(m)?'Use at least 6 characters.':/confirm/i.test(m)?'Check your email to confirm, or turn off Confirm email in Supabase.':'Could not sign in. Check your connection.'}
  else if(!data.session)$('err').textContent='Check your email to confirm, or turn off Confirm email in Supabase.'}
$('in').onclick=()=>authGo(sb.auth.signInWithPassword.bind(sb.auth));
$('up').onclick=()=>authGo(sb.auth.signUp.bind(sb.auth));
$('out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev,sess)=>{
  const u=sess&&sess.user;
  if(u){if(uid===u.id)return;uid=u.id;dirty=ls('wb-dirty-'+uid)||[];$('auth').classList.remove('show');live();flush().then(load)}
  else{uid=null;if(chan){sb.removeChannel(chan);chan=null}Object.keys(cache).forEach(k=>delete cache[k]);$('auth').classList.add('show');render()}
});
addEventListener('online',()=>{if(uid)flush().then(load)});
render();
</script>
</body>
